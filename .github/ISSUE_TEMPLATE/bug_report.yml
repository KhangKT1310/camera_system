name: Bug Report
description: Report a bug or unexpected behavior
title: "[BUG] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting an issue.
        Please provide enough information for us to reproduce the problem.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe the problem clearly.
      placeholder: What happened?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Describe how to reproduce the issue.
      placeholder: |
        1. Start application
        2. Open ...
        3. Execute ...
        4. Error occurs
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      placeholder: What actually happened?
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version / Commit
      placeholder: "v1.2.0 or commit SHA"

  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: |
        OS:
        Hardware:
        Browser:
        Firmware version:
        Other:

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Add relevant logs, stack traces, screenshots, or videos.
      render: shell

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Anything else that may help investigate the issue.

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues for duplicates.
          required: true
        - label: I can reproduce this issue with the latest version.
